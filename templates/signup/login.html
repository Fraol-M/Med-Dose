<!-- templates/signup/login.html -->

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            background-color: #1e2a38;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-container {
            background-color: #2d3e50;
            padding: 2rem;
            border-radius: 10px;
            width: 300px;
        }
        .form-container h2 {
            text-align: center;
            color: #66ccff;
        }
        .form-container input[type="text"],
        .form-container input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            margin: 0.5rem 0;
            border: none;
            border-radius: 5px;
        }
        .form-container button {
            width: 100%;
            padding: 0.5rem;
            background-color: #66ccff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: #1e2a38;
            font-weight: bold;
        }
        .form-container .link {
            margin-top: 1rem;
            text-align: center;
        }
        .form-container .link a {
            color: #66ccff;
            text-decoration: none;
        }
        .error {
            color: red;
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Login</h2>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div class="link">
            <p>Are you new? <a href="{% url 'register_view' %}">Create an account</a></p>
        </div>
    </div>
</body>
</html>
