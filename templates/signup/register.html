<!-- templates/signup/register.html -->

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <style>
        body {
            background-color: #1e2a38;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-container {
            background-color: #2d3e50;
            padding: 2rem;
            border-radius: 10px;
            width: 300px;
        }
        .form-container h2 {
            text-align: center;
            color: #66ccff;
        }
        .form-container input[type="text"],
        .form-container input[type="email"],
        .form-container input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            margin: 0.5rem 0;
            border: none;
            border-radius: 5px;
        }
        .form-container button {
            width: 100%;
            padding: 0.5rem;
            background-color: #66ccff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: #1e2a38;
            font-weight: bold;
        }
        .form-container .link {
            margin-top: 1rem;
            text-align: center;
        }
        .form-container .link a {
            color: #66ccff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Sign Up</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
        <div class="link">
            <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
        </div>
    </div>
</body>
</html>
